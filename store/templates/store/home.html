{% extends 'store/base.html' %}
{% load static %}

{% block hero_video %}
<div id="video-container" class="full-screen-logo">
  <video id="hero-logo-video" autoplay loop muted playsinline webkit-playsinline poster="{% static 'store/images/logo-poster.jpg' %}">
    <source src="{% static 'store/media/logo.mp4' %}" type="video/mp4" />
  </video>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const video = document.getElementById('hero-logo-video');
    
    // Fallback: Start playback on user's first touch/scroll
    const startVideo = function () {
      if (video && video.paused) {
        video.play().catch(() => {});
      }
    };

    document.addEventListener('touchstart', startVideo, { once: true });
    document.addEventListener('scroll', startVideo, { once: true });
  });
</script>
{% endblock %}
