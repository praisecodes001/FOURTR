{% extends 'store/base.html' %}
{% load humanize %}

{% block content %}
<section id="checkout-page" style="padding-top: 140px; position: relative; z-index: 5;">
  <div class="cart-container">
    <h2>CHECKOUT</h2>

    <!-- Dynamic Order Summary Breakdown -->
    <div class="checkout-summary" style="margin-bottom: 2rem; background: #141414; padding: 1.2rem; border: 1px solid #333; border-radius: 4px;">
      <div style="display: flex; justify-space-between; margin-bottom: 0.5rem; color: #ccc;">
        <span>Subtotal:</span>
        <span>₦<span id="subtotal-display">{{ total|intcomma }}</span></span>
      </div>
      <div style="display: flex; justify-space-between; margin-bottom: 0.5rem; color: #ccc;">
        <span>Shipping Fee:</span>
        <span style="color: #00ff66;">₦<span id="shipping-display">0</span></span>
      </div>
      <hr style="border-color: #333; margin: 0.8rem 0;">
      <div style="display: flex; justify-space-between; font-size: 1.2rem; font-weight: bold; color: #fff;">
        <span>Grand Total:</span>
        <span style="color: #fff;">₦<span id="grand-total-display">{{ total|intcomma }}</span></span>
      </div>
    </div>

    <form method="POST" action="{% url 'process_checkout' %}">
      {% csrf_token %}
      
      <h3 style="color: #fff; letter-spacing: 1px; margin-bottom: 1rem;">SHIPPING ADDRESS</h3>
      
      <input type="text" name="full_name" placeholder="Full Name" required style="width: 100%; background: #141414; border: 1px solid #333; color: #fff; padding: 0.8rem; margin-bottom: 1rem;" />
      <input type="email" name="email" placeholder="Email Address" required style="width: 100%; background: #141414; border: 1px solid #333; color: #fff; padding: 0.8rem; margin-bottom: 1rem;" />
      <input type="text" name="phone_number" placeholder="Phone Number" required style="width: 100%; background: #141414; border: 1px solid #333; color: #fff; padding: 0.8rem; margin-bottom: 1rem;" />
      
      <input type="text" name="street_address" placeholder="Street Address" required style="width: 100%; background: #141414; border: 1px solid #333; color: #fff; padding: 0.8rem; margin-bottom: 1rem;" />
      
      <div style="display: flex; gap: 1rem;">
        <input type="text" name="city" placeholder="City" required style="flex: 1; background: #141414; border: 1px solid #333; color: #fff; padding: 0.8rem; margin-bottom: 1rem;" />
        
        <!-- State Dropdown for Delivery Fee Calculation -->
        <select name="state" id="state-select" required onchange="calculateShipping()" style="flex: 1; background: #141414; border: 1px solid #333; color: #fff; padding: 0.8rem; margin-bottom: 1rem;">
          <option value="" disabled selected>Select Region / State</option>
          <option value="Lagos">Lagos (₦5,000)</option>
          <option value="Outside Lagos">Outside Lagos (₦10,000)</option>
        </select>
      </div>

      <button type="submit" class="btn" style="width: 100%;">Proceed to Payment</button>
    </form>

  </div>
</section>

<script>
  const baseSubtotal = {{ total }};

  function calculateShipping() {
    const state = document.getElementById('state-select').value;
    let shippingFee = 0;

    if (state === 'Lagos') {
      shippingFee = 5000;
    } else if (state === 'Outside Lagos') {
      shippingFee = 10000;
    }

    const grandTotal = baseSubtotal + shippingFee;

    // Update display values
    document.getElementById('shipping-display').innerText = shippingFee.toLocaleString();
    document.getElementById('grand-total-display').innerText = grandTotal.toLocaleString();
  }
</script>
{% endblock %}
